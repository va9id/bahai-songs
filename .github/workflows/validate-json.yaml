name: Validate Songs Data
on:
  push:
    paths:
      - 'assets/data/songs.json'
      - 'assets/data/schema.json'
      - 'assets/js/data.js'
      - 'scripts/validate-song-titles.mjs'
      - '.github/workflows/validate-json.yaml'
  pull_request:
    paths:
      - 'assets/data/songs.json'
      - 'assets/data/schema.json'
      - 'assets/js/data.js'
      - 'scripts/validate-song-titles.mjs'
      - '.github/workflows/validate-json.yaml'

jobs:
  validate_json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install AJV JSON Schema Validator
        run: npm install -g ajv-cli @ajv-validator/config

      - name: Validate songs json data against schema
        run: ajv validate -s assets/data/schema.json -d assets/data/songs.json --spec draft7

      # Song URLs are derived from titles, so a title that derives an empty or
      # duplicate URL would leave the song unreachable from its own link.
      - name: Check every song title makes a unique, resolvable URL
        run: node scripts/validate-song-titles.mjs
