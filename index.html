<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bahá'í Songs</title>
		<meta
			name="description"
			content="Collection of Bahá'í songs"
		/>

		<link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/assets/icons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/assets/icons/favicon-16x16.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/assets/icons/apple-touch-icon.png"
		/>
		<link rel="manifest" href="/assets/icons/site.webmanifest" />
		<link rel="stylesheet" href="/assets/css/style.css" />
		<meta name="theme-color" content="#faf5ec" />
		<script>
			// Applies a pinned theme before the first paint, so the page never
			// flashes the other one while loading.
			try {
				const theme = localStorage.getItem("theme");
				if (theme) {
					document.documentElement.dataset.theme = theme;
				}
			} catch (error) {
				/* Storage can be blocked; the system preference still applies. */
			}
		</script>
		<noscript>
			<style>
				#site-search,
				#theme-toggle {
					display: none;
				}
			</style>
		</noscript>
		<script type="module" src="/assets/js/theme.js"></script>
		<script type="module" src="/assets/js/search.js"></script>
		<script type="module" src="/assets/js/home.js"></script>

		<script
			async
			src="https://www.googletagmanager.com/gtag/js?id=G-TXC9T3QC04"
		></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag("js", new Date());
			gtag("config", "G-TXC9T3QC04");
		</script>
	</head>
	<body>
		<header id="site-header">
			<nav id="site-nav" aria-label="Main">
				<ul>
					<li>
						<a href="/" aria-current="page">Songs</a>
					</li>
					<li>
						<a href="/calendar.html">Calendar</a>
					</li>
				</ul>
			</nav>
			<button
				id="theme-toggle"
				type="button"
				aria-label="Switch to dark theme"
			>
				<svg
					id="theme-icon-moon"
					viewBox="0 0 24 24"
					width="20"
					height="20"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
				>
					<path d="M20.5 13.3A8.5 8.5 0 0 1 10.7 3.5a7.5 7.5 0 1 0 9.8 9.8Z" />
				</svg>
				<svg
					id="theme-icon-sun"
					viewBox="0 0 24 24"
					width="20"
					height="20"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
					hidden
				>
					<circle cx="12" cy="12" r="4" />
					<line x1="12" y1="2" x2="12" y2="4" />
					<line x1="12" y1="20" x2="12" y2="22" />
					<line x1="2" y1="12" x2="4" y2="12" />
					<line x1="20" y1="12" x2="22" y2="12" />
					<line x1="4.9" y1="4.9" x2="6.3" y2="6.3" />
					<line x1="17.7" y1="17.7" x2="19.1" y2="19.1" />
					<line x1="4.9" y1="19.1" x2="6.3" y2="17.7" />
					<line x1="17.7" y1="6.3" x2="19.1" y2="4.9" />
				</svg>
			</button>

			<search id="site-search">
				<form role="search" autocomplete="off">
					<label for="song-search">Search songs</label>
					<input
						type="search"
						id="song-search"
						name="q"
						placeholder="Search lyrics"
					/>
				</form>
				<div id="search-results" hidden></div>
			</search>
		</header>

		<main id="home">
			<h1 id="home-title">
				<span class="visually-hidden">Bahá'í Songs</span>
			</h1>
			<noscript>
				<p class="noscript-notice">
					The song list needs JavaScript to load. The
					<a href="/about.html">About</a> and
					<a href="/calendar.html">Calendar</a> pages work without it.
				</p>
			</noscript>
			<div id="songs-container"></div>
		</main>
		<footer id="site-footer">
			<nav aria-label="Secondary">
				<ul>
					<li><a href="/about.html">About</a></li>
					<li>
						<a
							href="https://github.com/va9id/bahai-songs"
							target="_blank"
							rel="noopener"
							>GitHub</a
						>
					</li>
				</ul>
			</nav>
			<p>&copy; 2025&ndash;2026 bahaisongs.ca</p>
		</footer>
	</body>
</html>
