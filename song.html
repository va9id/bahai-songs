<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bahá'í Songs</title>
		<meta name="description" content="Bahá'í song lyrics" />

		<link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/assets/icons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/assets/icons/favicon-16x16.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/assets/icons/apple-touch-icon.png"
		/>
		<link rel="manifest" href="/assets/icons/site.webmanifest" />
		<link rel="stylesheet" href="/assets/css/style.css" />
		<meta name="theme-color" content="#faf5ec" />
		<script>
			// Applies a pinned theme before the first paint, so the page never
			// flashes the other one while loading.
			try {
				const theme = localStorage.getItem("theme");
				if (theme) {
					document.documentElement.dataset.theme = theme;
				}
			} catch (error) {
				/* Storage can be blocked; the system preference still applies. */
			}
		</script>
		<noscript>
			<style>
				#site-search,
				#search-toggle,
				#theme-toggle,
				#random-song-btn {
					display: none;
				}
			</style>
		</noscript>
		<script type="module" src="/assets/js/theme.js"></script>
		<script type="module" src="/assets/js/search.js"></script>
		<script type="module" src="/assets/js/song.js"></script>
		<script
			async
			src="https://www.googletagmanager.com/gtag/js?id=G-TXC9T3QC04"
		></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag("js", new Date());
			gtag("config", "G-TXC9T3QC04");
		</script>
	</head>
	<body>
		<header id="site-header">
			<a class="site-brand" href="/">
				<svg
					viewBox="0 0 24 24"
					width="22"
					height="22"
					fill="currentColor"
					aria-hidden="true"
				>
					<path d="M12.00 1.00L 13.88 6.83 19.07 3.57 16.76 9.25 22.83 10.09 17.42 12.96 21.53 17.50 15.54 16.21 15.76 22.34 12.00 17.50 8.24 22.34 8.46 16.21 2.47 17.50 6.58 12.96 1.17 10.09 7.24 9.25 4.93 3.57 10.12 6.83Z" />
				</svg>
				Bahá'í Songs
			</a>
			<nav id="site-nav" aria-label="Main">
				<ul>
					<li>
						<a href="/calendar.html">Calendar</a>
					</li>
				</ul>
			</nav>
			<button
				id="theme-toggle"
				type="button"
				aria-label="Switch to dark theme"
			>
				<svg
					id="theme-icon-moon"
					viewBox="0 0 24 24"
					width="20"
					height="20"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
				>
					<path d="M20.5 13.3A8.5 8.5 0 0 1 10.7 3.5a7.5 7.5 0 1 0 9.8 9.8Z" />
				</svg>
				<svg
					id="theme-icon-sun"
					viewBox="0 0 24 24"
					width="20"
					height="20"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
					hidden
				>
					<circle cx="12" cy="12" r="4" />
					<line x1="12" y1="2" x2="12" y2="4" />
					<line x1="12" y1="20" x2="12" y2="22" />
					<line x1="2" y1="12" x2="4" y2="12" />
					<line x1="20" y1="12" x2="22" y2="12" />
					<line x1="4.9" y1="4.9" x2="6.3" y2="6.3" />
					<line x1="17.7" y1="17.7" x2="19.1" y2="19.1" />
					<line x1="4.9" y1="19.1" x2="6.3" y2="17.7" />
					<line x1="17.7" y1="6.3" x2="19.1" y2="4.9" />
				</svg>
			</button>
			<button
				id="search-toggle"
				type="button"
				aria-expanded="false"
				aria-controls="site-search"
				aria-label="Search songs"
			>
				<svg
					viewBox="0 0 24 24"
					width="20"
					height="20"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					aria-hidden="true"
				>
					<circle cx="10.5" cy="10.5" r="6.5" />
					<line x1="15.5" y1="15.5" x2="20.5" y2="20.5" />
				</svg>
			</button>
			<search id="site-search">
				<form role="search" autocomplete="off">
					<label for="song-search">Search songs</label>
					<input
						type="search"
						id="song-search"
						name="q"
						placeholder="Search lyrics"
					/>
				</form>
				<div id="search-results" hidden></div>
			</search>
		</header>

		<main id="song">
			<div id="song-header">
				<p id="song-breadcrumb">
					<a
						id="back-to-songs"
						href="/"
						title="All songs"
						aria-label="All songs"
					>
						<svg
							viewBox="0 0 24 24"
							width="20"
							height="20"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M19 12H5" />
							<path d="m12 19-7-7 7-7" />
						</svg>
					</a>
				</p>
				<button
					id="random-song-btn"
					type="button"
					title="Random song"
					aria-label="Random song"
				>
					<svg
						viewBox="0 0 24 24"
						width="20"
						height="20"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path
							d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"
						/>
						<path d="m18 2 4 4-4 4" />
						<path d="M2 6h1.9c1.5 0 2.9.8 3.6 2.1" />
						<path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
						<path d="m18 14 4 4-4 4" />
					</svg>
				</button>
			</div>
			<noscript>
				<p class="noscript-notice">
					Song lyrics need JavaScript to load. The
					<a href="/about.html">About</a> and
					<a href="/calendar.html">Calendar</a> pages work without it.
				</p>
			</noscript>
			<h1 id="song-title"></h1>
			<audio id="song-audio" controls hidden></audio>
			<div id="song-lyrics"></div>
			<p id="song-author"></p>
		</main>

		<footer id="site-footer">
			<nav aria-label="Secondary">
				<ul>
					<li><a href="/about.html">About</a></li>
					<li>
						<a
							href="https://github.com/va9id/bahai-songs"
							target="_blank"
							rel="noopener"
							>GitHub</a
						>
					</li>
				</ul>
			</nav>
			<p>&copy; 2025&ndash;2026 bahaisongs.ca</p>
		</footer>
	</body>
</html>
